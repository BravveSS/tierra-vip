<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi obra — Tierra Desarrollos</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/brand/tierra-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css?v=5">
</head>
<body>

<div class="wrap">
  <div class="pt-top">
    <a href="index.html"><img src="assets/img/brand/tierra-logo.png" alt="Tierra Desarrollos"></a>
    <div class="rt">
      <div class="who hidden" id="whoBox"><div class="avatar" id="avatar">·</div><span id="whoami" class="muted"></span></div>
      <button id="logout" class="btn ghost sm hidden">Salir</button>
    </div>
  </div>

  <!-- LOGIN -->
  <section id="login" class="login hidden">
    <div class="card">
      <h1>Portal de tu obra</h1>
      <div class="sub">Entra con el correo y la contraseña que te dio Tierra.</div>
      <form id="loginForm">
        <div class="field">
          <label>Correo</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button class="btn block" type="submit" id="loginBtn">Entrar</button>
        <div class="msg err" id="loginMsg"></div>
      </form>
    </div>
  </section>

  <div id="loading" class="spinner"></div>

  <!-- CONTENIDO (cliente) -->
  <main id="content" class="hidden"></main>
</div>

<!-- Lightbox -->
<div id="lb">
  <button class="x" aria-label="Cerrar">&#x2715;</button>
  <a class="dl" id="lbdl" download target="_blank" rel="noopener">Descargar ↓</a>
  <button class="nav prev" aria-label="Anterior">&#8249;</button>
  <img id="lbimg" src="" alt="">
  <button class="nav next" aria-label="Siguiente">&#8250;</button>
  <div class="cnt" id="lbcnt"></div>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/portal-config.js?v=2"></script>
<script src="assets/portal.js?v=4"></script>
</body>
</html>
