<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azimut en 3D — Tierra Desarrollos</title>
<meta name="description" content="Recorre en 3D la ladera de Mazunte donde se ubica Azimut — terreno con elevación satelital real.">
<meta name="theme-color" content="#211B16">
<link rel="icon" type="image/png" href="https://img1.wsimg.com/isteam/ip/55e35788-46e9-46a1-a282-5ca2f74e27f2/tierra-white2%20copy.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F0E8DA;--gold:#C9A96E;--gold-hi:#D6B67A;--muted:#9A8C76;--fh:'Cormorant Garamond',serif;--fb:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;color:var(--cream);font-family:var(--fb);
  background:linear-gradient(to top,#3a2410 0%,#5a3415 12%,#6b3d18 18%,#3a2a1c 32%,#241c1a 50%,#14110f 78%,#0c0a09 100%)}
#scene{position:fixed;inset:0;display:block;touch-action:none}
#grade{position:fixed;inset:0;z-index:9;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(to top,rgba(20,60,40,.35),transparent 45%,rgba(255,150,70,.34) 100%)}
#vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.5) 100%)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:linear-gradient(to bottom,rgba(15,17,19,.72),transparent)}
#topbar img{height:40px}
#back{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,232,218,.85);text-decoration:none;border:1px solid rgba(201,169,110,.4);padding:9px 18px;border-radius:22px;transition:all .25s;background:rgba(15,17,19,.5)}
#back:hover{background:var(--gold);color:#14110f}
#hud{position:fixed;left:28px;bottom:28px;z-index:20;pointer-events:none;max-width:360px;opacity:0;transform:translateY(16px);transition:opacity 1.2s cubic-bezier(.16,1,.3,1) .3s,transform 1.2s cubic-bezier(.16,1,.3,1) .3s}
#hud.on{opacity:1;transform:none}
#hud .e{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
#hud h1{font-family:var(--fh);font-weight:300;font-size:clamp(28px,4.5vw,46px);line-height:1.04}
#hud p{font-size:11.5px;color:rgba(240,232,218,.6);margin-top:8px;line-height:1.6}
#hint{position:fixed;bottom:28px;right:28px;z-index:20;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,232,218,.45);pointer-events:none}
.tag3d{position:fixed;z-index:15;transform:translate(-50%,-130%);font-family:var(--fh);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);background:rgba(15,17,19,.6);backdrop-filter:blur(8px);border:1px solid rgba(201,169,110,.55);padding:7px 16px;border-radius:18px;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.45);pointer-events:none}
#loading{position:fixed;inset:0;z-index:50;background:#14110f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s}
#loading.off{opacity:0;pointer-events:none}
#loading .t{font-family:var(--fh);font-style:italic;font-size:clamp(17px,2.4vw,24px);color:rgba(201,169,110,.85)}
#loading .s{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
#loading .bar{width:180px;height:1px;background:rgba(201,169,110,.2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(450%)}}
@media(max-width:760px){#hud{left:18px;bottom:74px;max-width:240px}#topbar{padding:14px 16px}#hint{left:18px;right:auto;bottom:18px}}
@media (prefers-reduced-motion:reduce){#loading .bar i{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Terreno 3D de Azimut, Mazunte"></canvas>
<div id="grade" aria-hidden="true"></div>
<div id="vig" aria-hidden="true"></div>
<div id="topbar">
  <a href="azimut.html"><img src="https://img1.wsimg.com/isteam/ip/55e35788-46e9-46a1-a282-5ca2f74e27f2/tierra-white2%20copy.png" alt="Tierra"></a>
  <a id="back" href="azimut.html">← Volver a Azimut</a>
</div>
<div id="hud">
  <div class="e">Azimut · Mazunte</div>
  <h1>La ladera,<br>tal como es.</h1>
  <p>Terreno con elevación satelital real — del mar a la selva alta de Mazunte. Arrastra para orbitar.</p>
</div>
<div id="hint">Arrastra · Acércate</div>
<div class="tag3d" id="tag" style="display:none">Azimut</div>
<div id="loading"><div class="t">Levantando el terreno…</div><div class="s">Azimut · Mazunte</div><div class="bar"><i></i></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" defer></script>
<script defer>
window.addEventListener('DOMContentLoaded', () => {
'use strict';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE  = matchMedia('(max-width:760px)').matches || (navigator.hardwareConcurrency||8) < 4;
const loadingEl = document.getElementById('loading');
const fail = m => { if(loadingEl) loadingEl.innerHTML = '<div class="t">'+m+'</div><div class="s"><a href="azimut.html" style="color:var(--gold)">← Volver</a></div>'; };
if (typeof THREE === 'undefined'){ fail('No se pudo cargar la vista 3D.'); return; }
if (!window.WebGLRenderingContext){ fail('Tu navegador no soporta 3D.'); return; }

const META = { minH:-50, maxH:200, lonW:-96.56982421875, lonE:-96.536865234375, latN:15.686509572551435, latS:15.654775665159693, hOFF:60, hSCALE:64 };
const AZ = { lon:-96.5545, lat:15.6695 };

const canvas = document.getElementById('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:!MOBILE, alpha:true, powerPreference:'high-performance' }); }
catch(e){ fail('No se pudo iniciar el 3D en este dispositivo.'); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE?1.5:2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('La vista 3D se reinició. Recarga la página.'); });

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a1a0e, 0.0026);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .1, 4000);

scene.add(new THREE.HemisphereLight(0xffb070, 0x1a140e, .9));
const sun = new THREE.DirectionalLight(0xFF9A45, 2.2); sun.position.set(80,60,260); scene.add(sun);
const warm = new THREE.DirectionalLight(0xFFC98A,.7); warm.position.set(-160,90,40); scene.add(warm);

// dimensiones del mundo (a partir del bbox real, metros aprox)
const KM = 111320;
const W = (META.lonE-META.lonW)*KM*Math.cos(15.67*Math.PI/180)/100;  // 1 u = 100 m
const D = (META.latN-META.latS)*KM/100;
const SCALE_W = W, SCALE_D = D;
const lon2x = lon => ((lon-META.lonW)/(META.lonE-META.lonW)-.5)*SCALE_W;
const lat2z = lat => ((META.latN-lat)/(META.latN-META.latS)-.5)*SCALE_D;
const VEXAG = 2.4;
const visY = m => (m>=0 ? m : m*.5)/100*VEXAG;

let ready=false, tagPos=null;
const hImg = new Image();
hImg.onerror = () => fail('No se pudo cargar el terreno. Revisa tu conexión.');
hImg.src = 'assets/img/3d/azimut-height.png';
hImg.onload = () => { try {
  const cv=document.createElement('canvas'); cv.width=hImg.width; cv.height=hImg.height;
  const cx=cv.getContext('2d'); cx.drawImage(hImg,0,0);
  const px=cx.getImageData(0,0,cv.width,cv.height).data;
  const meters=(u,v)=>{const ix=Math.max(0,Math.min(cv.width-1,Math.round(u*(cv.width-1)))),iy=Math.max(0,Math.min(cv.height-1,Math.round(v*(cv.height-1))));const o=(iy*cv.width+ix)*4;return (px[o]*256+px[o+1])/META.hSCALE-META.hOFF;};
  const sampleH=(lon,lat)=>meters((lon-META.lonW)/(META.lonE-META.lonW),(META.latN-lat)/(META.latN-META.latS));

  const SEG = MOBILE?180:340, SEGZ=Math.round(SEG*D/W);
  const geo=new THREE.PlaneGeometry(W,D,SEG,SEGZ); geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const u=p.getX(i)/W+.5,v=p.getZ(i)/D+.5;p.setY(i,visY(meters(u,v)));}
  geo.computeVertexNormals();
  const sat=new THREE.TextureLoader().load('assets/img/3d/azimut-sat.jpg');
  sat.anisotropy=renderer.capabilities.getMaxAnisotropy();
  scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:sat,roughness:.92,metalness:0})));

  // marcador del proyecto
  const x=lon2x(AZ.lon), z=lat2z(AZ.lat), y=Math.max(visY(sampleH(AZ.lon,AZ.lat)),0)+1.6;
  const g=new THREE.Group();
  const orb=new THREE.Mesh(new THREE.SphereGeometry(.7,18,18),new THREE.MeshStandardMaterial({color:0xC9A96E,emissive:0xC9A96E,emissiveIntensity:.6,roughness:.3}));
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,4,6),new THREE.MeshBasicMaterial({color:0xC9A96E,transparent:true,opacity:.4}));
  beam.position.y=-2; g.add(orb,beam); g.position.set(x,y,z); scene.add(g);
  tagPos=new THREE.Vector3(x,y+1.2,z); window.__orb=orb; window.__gpos=g.position;
  ready=true;
} catch(err){ console.error(err); fail('Hubo un problema al construir el terreno. Recarga.'); } };

// cámara orbital con inercia
let theta=-.7, phi=.5, radius=MOBILE?80:60, auto=true;
let tTheta=theta,tPhi=phi,tRadius=radius;
const center=new THREE.Vector3(0,2,0);
let intro=REDUCED?1:0, introT0=null;
const iFrom={theta:-1.9,phi:.92,radius:170};
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:tTheta,p:tPhi};auto=false;});
addEventListener('pointermove',e=>{if(!drag)return;tTheta=drag.t+(e.clientX-drag.x)*.005;tPhi=Math.max(.18,Math.min(1.15,drag.p+(e.clientY-drag.y)*.004));});
addEventListener('pointerup',()=>{drag=null;setTimeout(()=>auto=true,4000);});
canvas.addEventListener('wheel',e=>{e.preventDefault();tRadius=Math.max(22,Math.min(220,tRadius+e.deltaY*.07));},{passive:false});
let pinch=0;
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)tRadius=Math.max(22,Math.min(220,tRadius-(d-pinch)*.2));pinch=d;}},{passive:true});
canvas.addEventListener('touchend',()=>pinch=0);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const v3=new THREE.Vector3(); let t0=null;
function loop(ts){
  requestAnimationFrame(loop);
  if(document.hidden) return;
  if(!t0)t0=ts; const t=(ts-t0)/1000;
  if(ready && intro<1){
    if(introT0===null){introT0=ts;loadingEl.classList.add('off');document.getElementById('hud').classList.add('on');}
    intro=Math.min(1,(ts-introT0)/4000); const e=1-Math.pow(1-intro,3);
    theta=tTheta=iFrom.theta+(-.7-iFrom.theta)*e; phi=tPhi=iFrom.phi+(.5-iFrom.phi)*e; radius=tRadius=iFrom.radius+((MOBILE?80:60)-iFrom.radius)*e;
  }
  if(auto && intro>=1 && !REDUCED) tTheta+=.0006;
  theta+=(tTheta-theta)*.07; phi+=(tPhi-phi)*.07; radius+=(tRadius-radius)*.06;
  camera.position.set(center.x+radius*Math.sin(theta)*Math.cos(phi),center.y+radius*Math.sin(phi),center.z+radius*Math.cos(theta)*Math.cos(phi));
  camera.lookAt(center);
  if(window.__orb){ window.__orb.scale.setScalar(1+Math.sin(t*2)*.12); }
  const tag=document.getElementById('tag');
  if(tagPos && intro>=1){ v3.copy(tagPos).project(camera); const sx=(v3.x*.5+.5)*innerWidth, sy=(-v3.y*.5+.5)*innerHeight;
    const vis=v3.z<1; tag.style.display=vis?'block':'none'; if(vis){tag.style.left=sx+'px';tag.style.top=sy+'px';} }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
if(REDUCED) document.getElementById('hud').classList.add('on');
setTimeout(()=>{ if(!ready && loadingEl && !loadingEl.querySelector('a')) loadingEl.classList.add('off'); }, 14000);
});
</script>
</body>
</html>
