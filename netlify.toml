# Netlify — configuración del sitio Tierra
# El sitio es estático (publica la raíz). Las funciones dan el backend de IA.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────────────────
# UN DOMINIO POR LANDING
# Todos los dominios apuntan a ESTE mismo sitio de Netlify (como "alias de
# dominio"). Estas reglas hacen que la RAÍZ de cada dominio muestre su página,
# SIN cambiar la URL en el navegador (status = 200 = "rewrite", no redirect).
#
# IMPORTANTE:
#  - Reemplazá cada dominio de ejemplo por tu dominio REAL.
#  - Solo se reescribe la raíz "/"; los assets (/assets/...) pasan normales.
#  - Netlify redirige www → dominio principal solo, según lo que elijas en el panel.
#  - tierra.vip NO necesita regla: es el dominio principal y ya muestra el inicio.
# ─────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "https://nabani.com/"
  to = "/nabani.html"
  status = 200
  force = true

